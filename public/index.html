<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PJK-NAS</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        body {
            background: #f8fafc;
            padding: 2rem 1rem;
            max-width: 1000px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            margin-bottom: 2.5rem;
            color: #1e293b;
        }
        .header h1 {
            font-size: 2rem;
        }
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.2rem;
        }
        .card {
            background: #fff;
            border-radius: 16px;
            padding: 1.5rem;
            box-shadow: 0 4px 14px rgba(0,0,0,0.05);
            border: 1px solid #e2e8f0;
            transition: all 0.2s;
            position: relative;
        }
        .card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.08);
        }
        .card-tag {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 1rem;
        }
        .card-address {
            padding: 0.8rem 1rem;
            background: #f1f5f9;
            border-radius: 10px;
            font-family: monospace;
            word-break: break-all;
            margin-bottom: 1rem;
            display: none;
        }
        .card-address.show {
            display: block;
            animation: fadeIn 0.3s;
        }
        .btn-group {
            display: flex;
            gap: 0.6rem;
        }
        button {
            flex: 1;
            padding: 0.6rem 0;
            border-radius: 10px;
            border: none;
            font-weight: 500;
            cursor: pointer;
            font-size: 0.9rem;
        }
        .btn-toggle {
            background: #e2e8f0;
        }
        .btn-copy {
            background: #3b82f6;
            color: white;
        }
        .btn-copy.copied {
            background: #10b981;
        }
        .btn-delete {
            position: absolute;
            top: 12px;
            right: 12px;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: #fee2e2;
            color: #ef4444;
            border: none;
            cursor: pointer;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .empty {
            text-align: center;
            padding: 3rem 1rem;
            color: #64748b;
            grid-column: 1/-1;
        }
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #111827;
            color: white;
            padding: 10px 18px;
            border-radius: 8px;
            font-size: 14px;
            opacity: 0;
            transition: 0.3s;
        }
        .toast.show {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>PJK-NAS</h1>
    </div>
    <div class="card-grid" id="cardGrid"></div>
    <div class="toast" id="toast"></div>

    <script>
        let stunData = {};
        const API_TOKEN = ""; // 前端不用填，仅API鉴权

        async function loadData() {
            const container = document.getElementById('cardGrid');
            try {
                const res = await fetch("/api/get-stun");
                const data = await res.json();
                stunData = data.data || {};
                render();
            } catch (e) {
                container.innerHTML = "<div class='empty'>加载失败</div>";
            }
        }

        function render() {
            const container = document.getElementById('cardGrid');
            const keys = Object.keys(stunData);
            if (!keys.length) {
                container.innerHTML = "<div class='empty'>暂无数据</div>";
                return;
            }
            let html = "";
            keys.forEach(k => {
                html += `
                <div class='card' data-key='${k}'>
                    <button class='btn-delete'>×</button>
                    <div class='card-tag'>${k}</div>
                    <div class='card-address'>${stunData[k]}</div>
                    <div class='btn-group'>
                        <button class='btn-toggle'>显示地址</button>
                        <button class='btn-copy' data-addr='${stunData[k]}'>复制地址</button>
                    </div>
                </div>`;
            });
            container.innerHTML = html;
            bindEvents();
        }

        function bindEvents() {
            document.querySelectorAll(".btn-toggle").forEach(b => {
                b.addEventListener("click", () => {
                    const addr = b.closest(".card").querySelector(".card-address");
                    addr.classList.toggle("show");
                    b.textContent = addr.classList.contains("show") ? "隐藏地址" : "显示地址";
                });
            });

            document.querySelectorAll(".btn-copy").forEach(b => {
                b.addEventListener("click", async e => {
                    const addr = e.target.dataset.addr;
                    await navigator.clipboard.writeText(addr);
                    e.target.textContent = "✅ 已复制";
                    e.target.classList.add("copied");
                    setTimeout(() => {
                        e.target.textContent = "复制地址";
                        e.target.classList.remove("copied");
                    }, 1500);
                });
            });

            document.querySelectorAll(".btn-delete").forEach(b => {
                b.addEventListener("click", async () => {
                    const key = b.closest(".card").dataset.key;
                    if (!confirm("确定删除？")) return;
                    try {
                        await fetch("/api/delete-stun", {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({ key })
                        });
                        showToast("删除成功");
                        loadData();
                    } catch (e) {
                        showToast("操作失败");
                    }
                });
            });
        }

        function showToast(msg) {
            const t = document.getElementById("toast");
            t.textContent = msg;
            t.classList.add("show");
            setTimeout(() => t.classList.remove("show"), 1800);
        }

        window.addEventListener("DOMContentLoaded", loadData);
    </script>
</body>
</html>

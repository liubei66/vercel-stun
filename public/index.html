<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PJK-NAS 管理面板</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        body {
            background: #f8fafc;
            padding: 2rem 1rem;
            max-width: 1100px;
            margin: 0 auto;
        }
        .login-box {
            max-width: 380px;
            margin: 5rem auto;
            background: white;
            padding: 2rem;
            border-radius: 18px;
            box-shadow: 0 4px 18px rgba(0,0,0,0.07);
        }
        .login-box h2 {
            text-align: center;
            margin-bottom: 1.5rem;
            color: #1e293b;
        }
        .login-input {
            width: 100%;
            padding: 0.8rem 1rem;
            margin-bottom: 1rem;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            font-size: 1rem;
            transition: border 0.24s;
        }
        .login-input:focus {
            outline: none;
            border-color: #3b82f6;
        }
        .login-btn {
            width: 100%;
            padding: 0.8rem;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            cursor: pointer;
            transition: opacity .24s ease;
        }
        .login-btn:hover { opacity: 0.9 }
        #app { display: none; }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            color: #1e293b;
        }
        .header h1 { font-size: 1.8rem; }
        .logout { color: #ef4444; cursor: pointer; }
        .top-bar{
            display:flex;
            gap:10px;
            flex-wrap:wrap;
            margin-bottom:1.2rem;
        }
        .search-input{
            flex:1;
            min-width:260px;
            padding:0.7rem 1rem;
            border:1px solid #e2e8f0;
            border-radius:10px;
            font-size:14px;
            transition: border 0.24s;
        }
        .search-input:focus{
            outline: none;
            border-color:#3b82f6;
        }
        .export-btn{
            padding:0 16px;
            background:#6366f1;
            color:#fff;
            border:none;
            border-radius:10px;
            cursor:pointer;
            transition:opacity .24s ease;
        }
        .export-btn:hover{opacity:0.9}
        .add-form {
            background: #fff;
            padding: 1.2rem;
            border-radius: 18px;
            box-shadow: 0 4px 14px rgba(0,0,0,0.05);
            margin-bottom: 2rem;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .add-form input {
            flex:1;
            min-width:220px;
            padding:0.7rem;
            border:1px solid #e2e8f0;
            border-radius:10px;
            transition: border 0.24s;
        }
        .add-form input:focus{
            outline: none;
            border-color:#3b82f6;
        }
        .add-btn {
            padding:0 1.5rem;
            background:#10b981;
            color:#fff;
            border:none;
            border-radius:10px;
            cursor:pointer;
            transition:opacity .24s ease;
        }
        .add-btn:hover{opacity:0.9}
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.4rem;
        }
        .card {
            background: white;
            border-radius: 18px;
            padding: 1.5rem;
            box-shadow: 0 3px 12px rgba(0,0,0,0.06);
            position: relative;
            transition: all 0.32s cubic-bezier(0.2,0,0.2,1);
        }
        .card:hover {
            transform: translateY(-6px);
            box-shadow: 0 8px 26px rgba(0,0,0,0.13);
        }
        .card-tag {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 1rem;
            color:#1e293b;
        }
        .card-address {
            background: #f1f5f9;
            border-radius: 12px;
            max-height: 0;
            opacity: 0;
            padding: 0;
            overflow:hidden;
            word-break: break-all;
            transition: max-height 0.38s ease, opacity 0.32s ease, padding 0.32s ease;
            margin-bottom: 1rem;
        }
        .card-address.show {
            max-height: 320px;
            opacity: 1;
            padding: 0.8rem 1rem;
        }
        .btn-group { display: flex; gap: 0.55rem; }
        button {
            flex: 1;
            padding: 0.65rem 0;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            transition: all .22s ease;
            font-size: 14px;
        }
        button:hover{opacity:0.88; transform: scale(0.97);}
        .btn-toggle { background: #e2e8f0; color:#333; }
        .btn-go { background: #10b981; color: #fff; }
        .btn-copy { background: #3b82f6; color: white; }
        .btn-delete {
            position: absolute;
            top: 14px; right: 14px;
            width: 28px; height: 28px;
            border-radius: 50%;
            background: #fee2e2;
            color: #ef4444;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            padding:0;
            font-size: 16px;
        }
        .toast {
            position: fixed; bottom:30px; left:50%;
            transform:translateX(-50%);
            background:#111827; color:white;
            padding:10px 20px; border-radius:10px;
            opacity:0; transition:0.3s ease;
            z-index: 999;
        }
        .toast.show { opacity:1; }
    </style>
</head>

<body>

<div id="loginPanel" class="login-box">
    <h2>登录 PJK-NAS</h2>
    <input class="login-input" id="user" placeholder="用户名">
    <input class="login-input" id="pwd" type="password" placeholder="密码">
    <button class="login-btn" onclick="tryLogin()">登录</button>
</div>

<div id="app">
    <div class="header">
        <h1>PJK-NAS 管理面板</h1>
        <span class="logout" onclick="logout()">退出登录</span>
    </div>

    <div class="top-bar">
        <input class="search-input" id="searchKey" placeholder="搜索名称，实时筛选卡片" oninput="filterCard()">
        <button class="export-btn" onclick="exportJson()">导出全部JSON</button>
    </div>

    <div class="add-form">
        <input id="newKey" placeholder="名称：家庭NAS">
        <input id="newVal" placeholder="STUN/URL地址">
        <button class="add-btn" onclick="addItem()">新增保存</button>
    </div>

    <div class="card-grid" id="cardGrid"></div>
</div>

<div class="toast" id="toast"></div>

<script>
    let stunData = {};
    let rawData = {};

    function getToken() {
        return localStorage.getItem("nas_token") || "";
    }

    function isValidUrl(string) {
        try {
            const url = new URL(string);
            return url.protocol === "http:" || url.protocol === "https:";
        } catch (_) {
            return false;
        }
    }

    function goToAddress(addr) {
        if (!addr) return showToast("地址为空");
        if (isValidUrl(addr)) {
            window.open(addr, "_blank");
        } else {
            showToast("非有效 URL，无法访问");
        }
    }

    function filterCard(){
        const kw = document.getElementById("searchKey").value.trim().toLowerCase();
        if(!kw){ stunData = {...rawData}; }else{
            const tmp = {};
            Object.keys(rawData).forEach(k=>{
                if(k.toLowerCase().includes(kw)) tmp[k]=rawData[k];
            })
            stunData = tmp;
        }
        render();
    }

    function exportJson(){
        const blob = new Blob([JSON.stringify(rawData, null, 2)], {type:"application/json"});
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "stun_list.json";
        a.click();
        showToast("导出成功");
    }

    function checkAuth() {
        if (localStorage.getItem("nas_auth") === "ok") {
            document.getElementById("loginPanel").style.display = "none";
            document.getElementById("app").style.display = "block";
            loadData();
        } else {
            document.getElementById("loginPanel").style.display = "block";
            document.getElementById("app").style.display = "none";
        }
    }

    async function tryLogin() {
        const u = document.getElementById("user").value.trim();
        const p = document.getElementById("pwd").value.trim();
        if (!u || !p) return showToast("请输入账号密码");

        try {
            const res = await fetch("/api/login", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ username: u, password: p })
            });
            const data = await res.json();
            if (data.success && data.token) {
                localStorage.setItem("nas_auth", "ok");
                localStorage.setItem("nas_token", data.token);
                showToast("登录成功");
                setTimeout(checkAuth, 600);
            } else {
                showToast("账号或密码错误");
            }
        } catch (e) {
            showToast("网络异常");
        }
    }

    function logout() {
        localStorage.removeItem("nas_auth");
        localStorage.removeItem("nas_token");
        showToast("已退出");
        setTimeout(checkAuth, 600);
    }

    async function addItem() {
        const key = document.getElementById("newKey").value.trim();
        const value = document.getElementById("newVal").value.trim();
        if (!key || !value) return showToast("名称和地址不能为空");

        try {
            const res = await fetch("/api/update-stun", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": getToken()
                },
                body: JSON.stringify({ key, value })
            });
            const d = await res.json();
            if (d.success) {
                showToast("添加成功");
                document.getElementById("newKey").value = "";
                document.getElementById("newVal").value = "";
                loadData();
            } else {
                showToast(d.msg || "操作失败");
            }
        } catch (e) {
            showToast("保存失败");
        }
    }

    async function loadData() {
        try {
            const r = await fetch("/api/get-stun", {
                headers: { "Authorization": getToken() }
            });
            const d = await r.json();
            if (!d.success) {
                logout();
                return;
            }
            rawData = d.data || {};
            stunData = { ...rawData };
            render();
        } catch (e) {
            showToast("加载失败");
        }
    }

    function render() {
        const el = document.getElementById("cardGrid");
        let html = "";
        Object.keys(stunData).forEach(k => {
            const addr = stunData[k];
            html += `
            <div class="card" data-key="${k}">
                <button class="btn-delete">×</button>
                <div class="card-tag">${k}</div>
                <div class="card-address">${addr}</div>
                <div class="btn-group">
                    <button class="btn-toggle">显示</button>
                    <button class="btn-go" onclick="goToAddress('${addr.replace(/'/g, "\\'")}')">访问</button>
                    <button class="btn-copy" data-addr="${addr}">复制</button>
                </div>
            </div>`;
        });
        el.innerHTML = html || '<div style="grid-column:1/-1;text-align:center;padding:3rem;color:#999">暂无数据</div>';
        bindEvents();
    }

    function bindEvents() {
        document.querySelectorAll(".btn-toggle").forEach(b => {
            b.onclick = () => {
                const a = b.closest(".card").querySelector(".card-address");
                a.classList.toggle("show");
                b.textContent = a.classList.contains("show") ? "隐藏" : "显示";
            };
        });

        document.querySelectorAll(".btn-copy").forEach(b => {
            b.onclick = async () => {
                try {
                    await navigator.clipboard.writeText(b.dataset.addr);
                    b.textContent = "✅ 已复制";
                    setTimeout(() => b.textContent = "复制", 1500);
                } catch { showToast("复制失败"); }
            };
        });

        document.querySelectorAll(".btn-delete").forEach(b => {
            b.onclick = async () => {
                if (!confirm("确定删除本条记录？")) return;
                const key = b.closest(".card").dataset.key;
                try {
                    await fetch("/api/delete-stun", {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json",
                            "Authorization": getToken()
                        },
                        body: JSON.stringify({ key })
                    });
                    showToast("删除成功");
                    loadData();
                } catch (e) {
                    showToast("删除失败");
                }
            };
        });
    }

    function showToast(m){
        const t = document.getElementById("toast");
        t.textContent = m;
        t.classList.add("show");
        setTimeout(() => t.classList.remove("show"), 1800);
    }

    checkAuth();
</script>

</body>
</html>
